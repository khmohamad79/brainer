<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brainer — Teams</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="memobar" role="status" aria-live="polite" aria-atomic="true">
    <span id="memobar-text"></span>
  </div>
  <div class="shell">
    <header>
      <div>
        <p class="eyebrow">company roster</p>
        <h1>Teams</h1>
      </div>
      <div>
        <p class="lede">Official names plus optional nicknames. Saved under memory with assignments.</p>
        <nav class="nav" aria-label="Primary">
          <a href="/">Capture</a>
          <a href="/teams" aria-current="page">Teams</a>
        </nav>
      </div>
    </header>

    <form id="add-team" class="add-inline">
      <div>
        <label for="team-name">New team</label>
        <input id="team-name" name="name" type="text" required placeholder="Platform" autocomplete="off" />
      </div>
      <div>
        <label for="team-nicks">Nicknames</label>
        <input id="team-nicks" name="nicknames" type="text" placeholder="plat, infra" autocomplete="off" />
      </div>
      <button type="submit" id="save-team">Add team</button>
    </form>
    <p id="status" class="status" aria-live="polite"></p>

    <div class="layout">
      <section>
        <h2>Teams</h2>
        <ul id="list" class="list"></ul>
      </section>
      <section id="detail" class="detail empty">
        <p class="muted">Select a team.</p>
      </section>
    </div>
  </div>
  <script src="/static/memory-bar.js"></script>
  <script src="/static/teams.js"></script>
</body>
</html>
