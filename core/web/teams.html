<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brainer — Teams</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="topbar">
    <nav class="nav" aria-label="Primary">
      <a href="/">Capture</a>
      <a href="/teams" aria-current="page">Teams</a>
    </nav>
    <div class="memobar" role="status" aria-live="polite" aria-atomic="true">
      <span id="memobar-text"></span>
    </div>
    <div></div>
  </header>

  <div class="app">
    <main class="main" id="main">
      <form id="add-team" class="composer">
        <input id="team-name" name="name" type="text" required autocomplete="off" aria-label="Team name" />
        <button type="submit" id="save-team" class="composer-submit">Add</button>
      </form>
      <section id="detail" class="detail" hidden></section>
      <p id="status" class="status" aria-live="polite"></p>
    </main>

    <aside class="sidebar">
      <div class="sidebar-head">
        <span>Teams</span>
        <button type="button" class="linkish" id="new-team">New</button>
      </div>
      <ul id="list" class="list"></ul>
    </aside>
  </div>

  <script src="/static/memory-bar.js"></script>
  <script src="/static/teams.js"></script>
</body>
</html>
