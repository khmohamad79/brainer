<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brainer</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="topbar">
    <nav class="nav" aria-label="Primary">
      <a href="/" aria-current="page">Capture</a>
      <a href="/teams">Teams</a>
    </nav>
    <div class="memobar" role="status" aria-live="polite" aria-atomic="true">
      <span id="memobar-text"></span>
    </div>
    <div></div>
  </header>

  <div class="app">
    <main class="main">
      <form id="capture" class="composer">
        <textarea id="raw" name="raw" rows="8" required dir="auto"></textarea>
        <p id="save-status" class="status" aria-live="polite"></p>
        <button type="submit" id="save" class="composer-submit">Record</button>
      </form>
      <section id="detail" class="detail" hidden></section>
    </main>

    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="side-tabs" role="tablist">
          <button type="button" class="side-tab" role="tab" id="tab-inbox" aria-selected="true">Inbox</button>
          <button type="button" class="side-tab" role="tab" id="tab-archive" aria-selected="false">Archive</button>
        </div>
        <button type="button" class="linkish" id="new-task">New</button>
      </div>
      <ul id="list" class="list"></ul>
    </aside>
  </div>

  <script src="/static/memory-bar.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
